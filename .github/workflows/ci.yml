name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Supplied lockfile is preserved; dependency audit and live integration remain separate gates.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm verify:source
