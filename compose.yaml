name: intradocs-local
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: intradocs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d intradocs']
      interval: 3s
      timeout: 3s
      retries: 25
    restart: unless-stopped
  clamav:
    image: clamav/clamav:1.4.6_base
    profiles: ['knowledge']
    environment:
      TZ: UTC
      CLAMAV_NO_MILTERD: 'true'
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 4g
    cpus: 1.0
    restart: unless-stopped
  converter:
    build: ./apps/knowledge-runtime
    profiles: ['knowledge']
    environment:
      KNOWLEDGE_TOKEN: ${KNOWLEDGE_TOKEN:-}
      KNOWLEDGE_BIND: 0.0.0.0
    ports:
      - '127.0.0.1:${KNOWLEDGE_PORT:-8091}:8091'
    networks: [conversion]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
  weknora-postgres:
    profiles: ['weknora']
    image: paradedb/paradedb:v0.22.2-pg17
    environment:
      POSTGRES_DB: weknora
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: ${WEKNORA_DB_PASSWORD:?Run pnpm weknora:setup first}
    # No published port: only the WeKnora container needs to reach it.
    volumes:
      - weknora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weknora -d weknora']
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${WEKNORA_DB_MEMORY_LIMIT:-1g}
          cpus: '1'
    restart: unless-stopped

  weknora-redis:
    profiles: ['weknora']
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${WEKNORA_REDIS_PASSWORD:?Run pnpm weknora:setup first}',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${WEKNORA_REDIS_PASSWORD:?}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    # Cache and stream buffer only; nothing here is a system of record, so no volume.
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.5'
    restart: unless-stopped

  weknora-app:
    profiles: ['weknora']
    image: wechatopenai/weknora-app:${WEKNORA_VERSION:-latest}
    depends_on:
      weknora-postgres:
        condition: service_healthy
      weknora-redis:
        condition: service_healthy
    ports:
      # Loopback only. The API key is a server-side credential; nothing on the LAN
      # should be able to reach this port.
      - '127.0.0.1:${WEKNORA_PORT:-58080}:8080'
    environment:
      GIN_MODE: release
      LOG_LEVEL: ${WEKNORA_LOG_LEVEL:-info}
      TZ: ${WEKNORA_TZ:-Asia/Jakarta}
      # Language of everything WeKnora generates at ingest (summary, questions, tags).
      # Without it WeKnora falls back to zh-CN and a qwen model obliges in Chinese. Its
      # locale map knows zh/en/ko/ja/ru/fr/de/es/pt only; any other value is passed into
      # the prompt verbatim ("Generate questions in {{language}}"), so this is the
      # language NAME, not a BCP-47 tag -- "id-ID" came back as English.
      WEKNORA_LANGUAGE: ${WEKNORA_LANGUAGE:-Indonesian}
      AUTO_MIGRATE: 'true'
      DB_DRIVER: postgres
      DB_HOST: weknora-postgres
      DB_PORT: '5432'
      DB_USER: weknora
      DB_PASSWORD: ${WEKNORA_DB_PASSWORD:?Run pnpm weknora:setup first}
      DB_NAME: weknora
      REDIS_ADDR: weknora-redis:6379
      REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD:?Run pnpm weknora:setup first}
      REDIS_DB: '0'
      STREAM_MANAGER_TYPE: redis
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      RETRIEVE_DRIVER: postgres
      JWT_SECRET: ${WEKNORA_JWT_SECRET:?Run pnpm weknora:setup first}
      SYSTEM_AES_KEY: ${WEKNORA_AES_KEY:?Run pnpm weknora:setup first}
      # One workspace, created once by pnpm weknora:setup, which is the only moment
      # registration is needed. Turn registration off afterwards.
      DISABLE_REGISTRATION: ${WEKNORA_DISABLE_REGISTRATION:-false}
      WEKNORA_TENANT_AUTO_CREATE_API_KEY: 'true'
      WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED: 'true'
      WEKNORA_TENANT_ENABLE_RBAC: 'true'
      WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS: 'false'
      # Risky subsystems stay off explicitly rather than by relying on defaults.
      WEKNORA_SANDBOX_DOCKER_ENABLED: 'false'
      OIDC_AUTH_ENABLE: 'false'
      # WeKnora blocks outbound targets by default. The embedding model runs as Ollama on
      # the host, so exactly that one name is allowed back in -- not a wildcard, not a
      # CIDR. Adding a cloud provider here means questions and document passages leave the
      # machine, so it is opt-in through the environment and never a default; the portal
      # additionally refuses to use it until AI_GENERATION_LOCATION says so out loud.
      # host.docker.internal for Ollama; weknora-reranker for the optional TEI service.
      SSRF_WHITELIST_EXTRA: ${WEKNORA_SSRF_WHITELIST_EXTRA:-host.docker.internal,weknora-rerank-shim}
      OLLAMA_OPTIONAL: 'true'
      OLLAMA_BASE_URL: ${WEKNORA_OLLAMA_URL:-http://host.docker.internal:11434}
      CONCURRENCY_POOL_SIZE: ${WEKNORA_CONCURRENCY:-2}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      default:
        # The optional weknora-ui image ships an nginx that proxies to the hardcoded
        # upstream `app`. An alias satisfies it without editing someone else's image or
        # renaming this service, and costs nothing when the UI is not running.
        aliases: ['app']
    volumes:
      - weknora_files:/data/files
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${WEKNORA_MEMORY_LIMIT:-2g}
          cpus: '${WEKNORA_CPU_LIMIT:-2}'
    restart: unless-stopped

  # WeKnora's own web interface. Deliberately NOT part of the 'weknora' profile: it is an
  # operator tool, not a second way into the corpus.
  #
  # What it is honest about: signing in here is signing in to WeKnora, not to IntraDocs.
  # WeKnora has no idea what a classification, an approval state, a category scope or a
  # grant is, so anyone who reaches this UI sees every indexed chunk of every document --
  # including the restricted ones -- regardless of what IntraDocs would allow them. That
  # is why it can never be the portal users log into, and why the whole M4 design puts
  # IntraDocs in front as the policy gate.
  #
  # It stays useful for exactly one job: looking at what was actually indexed when
  # retrieval behaves oddly -- chunks, tags, parse status. Start it only when doing that:
  #
  #   docker compose --env-file .env.local --profile weknora --profile weknora-ui \n  #     up -d weknora-ui
  #
  # Both profiles are needed: the UI is useless without the backend it depends on, and
  # naming only this profile leaves that dependency undefined.
  #
  # Since registration is closed after bootstrap, the only account that can sign in is the
  # service account in var/weknora-service.json, which is gitignored and local to this
  # machine. Reaching the UI therefore already means having that file.
  weknora-ui:
    profiles: ['weknora-ui']
    image: wechatopenai/weknora-ui:${WEKNORA_VERSION:-latest}
    depends_on:
      weknora-app:
        condition: service_healthy
    ports:
      # Loopback only, like the API. Nothing on the LAN reaches the corpus.
      - '127.0.0.1:${WEKNORA_UI_PORT:-47081}:80'
    environment:
      TZ: ${WEKNORA_TZ:-Asia/Jakarta}
      # The SPA reaches the backend over the compose network via the `app` alias that
      # weknora-app carries, so the API port never has to be reachable from the browser.
    deploy:
      resources:
        limits:
          memory: ${WEKNORA_UI_MEMORY_LIMIT:-256m}
          cpus: '0.5'
    restart: unless-stopped

  # Reranker for WeKnora's chat pipeline (optional profile `weknora-rerank`).
  #
  # Ollama has no /rerank endpoint, so a rerank model registered against it can never be
  # called (WEKNORA.md §11). text-embeddings-inference serves BAAI/bge-reranker-v2-m3,
  # the multilingual cross-encoder that is the right choice for Indonesian text, behind
  # the shim below. Nothing from the corpus is sent anywhere: the container only receives
  # (question, chunk) pairs from the shim over the compose network and is published
  # nowhere. The weights are the int8 ONNX export copied into the volume by
  # `pnpm weknora:rerank-weights` (pinned revision and sha256): the fp32 original needs
  # ~2.8 GB resident during warm-up and was OOM-killed by the 4 GB Docker VM every time,
  # the int8 one runs at ~1.8 GB through TEI's ORT backend and scores the model card's
  # sample pair identically. WEKNORA_RERANK_MODEL_PATH=BAAI/bge-reranker-v2-m3 downloads
  # and runs the fp32 weights instead on a VM with 6 GB or more.
  weknora-reranker:
    profiles: ['weknora-rerank']
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    # Warm-up runs one sequence of --max-batch-tokens through the model; the attention
    # scores alone are 16 x n^2 x 4 bytes per layer, so the 8192 default and 4096 both
    # pushed the fp32 container past 3 GB. A (question, chunk) pair here is a few hundred
    # tokens, so the cap only sets how many pairs share a forward pass.
    command:
      - '--model-id'
      - '${WEKNORA_RERANK_MODEL_PATH:-/data/bge-reranker-v2-m3-int8}'
      - '--max-batch-tokens'
      - '${WEKNORA_RERANK_MAX_BATCH_TOKENS:-1024}'
      - '--max-batch-requests'
      - '8'
      # WeKnora posts every retrieval candidate in one request.
      - '--max-client-batch-size'
      - '64'
      # Required once max-batch-tokens is below the model's 8192 input length; nothing
      # of chunk size is ever actually truncated.
      - '--auto-truncate'
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: '0'
    volumes:
      - weknora_reranker_cache:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:80/health']
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${WEKNORA_RERANK_MEMORY_LIMIT:-3200m}
          cpus: '${WEKNORA_RERANK_CPU_LIMIT:-4}'
    restart: unless-stopped
  # WeKnora's generic reranker speaks the Jina/Cohere shape ({model, query, documents} ->
  # {results: [{index, relevance_score}]}); TEI speaks its own ({query, texts} ->
  # [{index, score}]). Neither is configurable, so this dependency-free Node script
  # translates between them. It is the only rerank host WeKnora is allowed to reach.
  weknora-rerank-shim:
    profiles: ['weknora-rerank']
    image: node:22-alpine
    command: ['node', '/app/server.mjs']
    environment:
      RERANK_UPSTREAM: http://weknora-reranker:80
      # 1 logs each query with the top scores and the first 120 chars of every passage;
      # that is corpus text, so leave it off outside a synthetic corpus.
      RERANK_SHIM_DEBUG: ${WEKNORA_RERANK_SHIM_DEBUG:-0}
      RERANK_SHIM_DEBUG_CHARS: ${WEKNORA_RERANK_SHIM_DEBUG_CHARS:-120}
    volumes:
      - ./scripts/rerank-shim.mjs:/app/server.mjs:ro
    depends_on:
      weknora-reranker:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:80/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

networks:
  conversion:
    # NOT internal. Docker cannot publish a port from an internal-only network, so with
    # internal:true the converter's 127.0.0.1:8091 binding was silently inert and every
    # upload failed with converter_unavailable -- the worker runs on the host, not in
    # Docker. Egress prevention now rests on the other controls the service already has:
    # read_only root, cap_drop ALL, no-new-privileges, pids/memory limits, no credentials
    # and no host mounts. Re-enable internal:true only when the worker also runs in
    # Compose, where it can reach the converter without a published port.
    internal: false
volumes:
  clamav_data:
  postgres_data:
  weknora_pgdata:
  weknora_files:
  weknora_reranker_cache:
